name: Deploy Dashboard to GitHub Pages

# Runs on every push to main (and supports manual triggers).
# Injects the FINNHUB_KEY repo secret into index.html at build time so
# the API key is never stored in git history.
#
# Setup checklist:
#   1. Add a repo secret named FINNHUB_KEY (Settings → Secrets and variables
#      → Actions → New repository secret).
#   2. Enable Pages with the "GitHub Actions" source
#      (Settings → Pages → Source → GitHub Actions).
#   3. Push to main. The workflow builds and deploys automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; queue new ones instead of cancelling.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Finnhub API key into index.html
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          if [ -z "$FINNHUB_KEY" ]; then
            echo "::warning::FINNHUB_KEY secret is not set — site will deploy in snapshot mode."
          else
            echo "FINNHUB_KEY secret found, injecting into index.html"
            # Replace the placeholder string. Using a delimiter unlikely to
            # appear in a Finnhub key (|) avoids escaping issues.
            sed -i "s|__FINNHUB_KEY_PLACEHOLDER__|${FINNHUB_KEY}|g" index.html
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the whole repo root. index.html is the entry point.
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
